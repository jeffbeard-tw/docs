openapi: 3.0.3
info:
  title: MerchantE Partner to Portal API
  description: |
    The MerchantE Partner to Portal API offers a streamlined process to pass merchant business information 
    related to a sales opportunity, a partial application, or a completed application to MerchantE. This API 
    model is based on the MerchantE application and the business information required to underwrite and 
    onboard merchants with our company.
    
    Clients of this API are granted the ability to create, update, or delete Salesforce objects containing 
    business information specific to an opportunity, directly from their own customer relationship management 
    system. These objects are then transposed to the Partner Portal in a viewable format, where they will 
    display data needed to onboard the account so that the merchant may begin to process credit card 
    transactions.
    
    ## Documentation
    - Technical documentation and SDK libraries: https://developer.merchante.com
    - PCI Security Standards: https://www.pcisecuritystandards.org/
    - NAICS lookup: https://www.census.gov/econ/isp/
    
    ## Important Notes
    - The Merchant DBA Name is always required
    - DDA Type is required when submitting checking account information
    - Entity Type, Last Name and Contact Role are required when submitting contact information
    - Product Name is required when submitting equipment information
    - Updates to applications in "Pending Underwriting" or "Closed Won" stages are not allowed
  version: "3.5"
  contact:
    name: MerchantE Partner Support
    url: https://www.merchante.com
  license:
    name: Proprietary
    url: https://www.merchante.com

servers:
  - url: https://merchante-solutions.my.salesforce.com
    description: Production server
  - url: https://test.salesforce.com
    description: Certification server

security:
  - OAuth2: []

paths:
  /services/oauth2/token:
    post:
      summary: Get Authentication Token
      description: |
        Generate an OAuth 2.0 access token for API authentication.
        
        **Note**: Auth token is valid for 24 hours.
      operationId: getAuthToken
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
                - username
                - password
              properties:
                grant_type:
                  type: string
                  enum:
                    - password
                  description: Literal "password" text
                client_id:
                  type: string
                  description: Different for each sandbox/org (provided by SE)
                client_secret:
                  type: string
                  description: Different for each sandbox/org (provided by SE)
                username:
                  type: string
                  example: partnerportalapi@merchante.com.cert
                  description: Different for each sandbox/org
                password:
                  type: string
                  description: Password + Security Token (provided by secure email). Security Token is not always required depending on the org configuration
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: OAuth 2.0 access token (valid for 24 hours)
                  instance_url:
                    type: string
                  id:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  issued_at:
                    type: string
                  signature:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/data/v54.0/composite/sobjects:
    post:
      summary: Create Merchant Application
      description: |
        Creates a new merchant application with all related objects including Account, Opportunity, 
        Contacts (Beneficial Owners), Business Checking Accounts, Quote, and Quote Line Items.
        
        **Required Information**:
        - The Merchant DBA Name is always required
        - DDA Type is required when submitting checking account information
        - Entity Type, Last Name and Contact Role are required when submitting contact information
        - Product Name is required when submitting equipment information
        
        **Business Rules**:
        - At least one Primary Contact/Beneficial Owner must be identified
        - Only one Control Owner is allowed per application
        - Only one Authorized Signer is allowed per application
        - Maximum 4 Beneficial Owners are allowed per application
        - Only 1 Beneficial Owner is allowed for Sole Proprietorship
        - Sum of % Ownership for all Beneficial Owners must not exceed 100%
      operationId: createApplication
      tags:
        - Merchant Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: Application created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

    patch:
      summary: Update Merchant Application
      description: |
        Updates an existing merchant application and its related objects.
        
        **Important Notes**:
        - The "id" field represents the SFId of the ObjectType being updated
        - Include the Opportunity SFID for Update requests
        - Source ID can be used to relate SFID to the corresponding fields provided
        - Updates to applications in "Pending Underwriting" or "Closed Won" stages are not allowed
      operationId: updateApplication
      tags:
        - Merchant Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Application updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /services/data/v54.0/sobjects/Opportunity/{opportunityId}:
    get:
      summary: Get Opportunity
      description: Retrieve information for a specific opportunity
      operationId: getOpportunity
      tags:
        - Retrieval
      parameters:
        - name: opportunityId
          in: path
          required: true
          description: The SFId value associated with the ObjectType Opportunity
          schema:
            type: string
      responses:
        '200':
          description: Opportunity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '404':
          description: Opportunity not found

  /services/data/v54.0/sobjects/Opportunity/{opportunityId}/Account:
    get:
      summary: Get Account
      description: Retrieve account information for a specific opportunity
      operationId: getAccount
      tags:
        - Retrieval
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /services/data/v54.0/sobjects/Opportunity/{opportunityId}/Account/Contacts:
    get:
      summary: Get Contacts
      description: Retrieve all contacts for a specific opportunity's account
      operationId: getContacts
      tags:
        - Retrieval
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'

  /services/data/v54.0/sobjects/Opportunity/{opportunityId}/Account/Business_Checking_Accounts__r:
    get:
      summary: Get Business Checking Accounts
      description: Retrieve all business checking accounts for a specific opportunity's account
      operationId: getBusinessCheckingAccounts
      tags:
        - Retrieval
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of business checking accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessCheckingAccount'

  /services/data/v54.0/sobjects/Opportunity/{opportunityId}/Quotes:
    get:
      summary: Get Quotes
      description: Retrieve all quotes for a specific opportunity
      operationId: getQuotes
      tags:
        - Retrieval
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quote'

  /services/data/v54.0/sobjects/Quote/{quoteId}/QuoteLineItems:
    get:
      summary: Get Quote Line Items
      description: Retrieve all quote line items for a specific quote
      operationId: getQuoteLineItems
      tags:
        - Retrieval
      parameters:
        - name: quoteId
          in: path
          required: true
          description: The SFId value associated with the ObjectType Quote
          schema:
            type: string
      responses:
        '200':
          description: List of quote line items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteLineItem'

  /services/data/v54.0/sobjects/Attachment:
    post:
      summary: Submit Attachments
      description: |
        Submit file attachments for an opportunity.
        
        **Requirements**:
        - Opportunity ID is required
        - File size limit: 100 MB per file
        - Files must be converted to Base64
        - Maximum total attachment size: 2 GB
        - Attachments must be transmitted to this alternate endpoint
      operationId: submitAttachments
      tags:
        - Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
      responses:
        '201':
          description: Attachments created successfully
        '400':
          description: Bad request (e.g., file too large, missing Opportunity ID)

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authentication using password grant type. Access token must be passed as Type "OAUTH 2.0" with the authorization header.
      flows:
        password:
          tokenUrl: /services/oauth2/token
          scopes: {}

  schemas:
    CreateApplicationRequest:
      type: object
      required:
        - Opp
        - Mer
      properties:
        Opp:
          $ref: '#/components/schemas/Opportunity'
        Mer:
          $ref: '#/components/schemas/Account'
        lstBens:
          type: array
          description: List of Beneficial Owners (Contacts)
          items:
            $ref: '#/components/schemas/Contact'
        lstbussCheckAcc:
          type: array
          description: List of Business Checking Accounts
          items:
            $ref: '#/components/schemas/BusinessCheckingAccount'
        Lstqli:
          type: array
          description: List of Quote Line Items (Solutions, Fees, Equipment)
          items:
            $ref: '#/components/schemas/QuoteLineItem'

    UpdateApplicationRequest:
      type: object
      required:
        - Opp
        - Mer
      properties:
        Opp:
          allOf:
            - $ref: '#/components/schemas/Opportunity'
            - type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: The SFId of the Opportunity being updated (required for updates)
        Mer:
          allOf:
            - $ref: '#/components/schemas/Account'
            - type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: The SFId of the Account being updated (required for updates)
        lstBens:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Contact'
              - type: object
                properties:
                  id:
                    type: string
                    description: The SFId of the Contact being updated
        lstbussCheckAcc:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BusinessCheckingAccount'
              - type: object
                properties:
                  id:
                    type: string
                    description: The SFId of the Business Checking Account being updated
        Lstqli:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuoteLineItem'
              - type: object
                properties:
                  Id:
                    type: string
                    description: The SFId of the Quote Line Item being updated (note capital 'I')

    Opportunity:
      type: object
      required:
        - attributes
        - BET_Table_ID_API_Field__c
        - Yearly_Net_Revenue__c
        - Visa_MC_Discover_Volume__c
        - Merchant_Application_Notes__c
      properties:
        attributes:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - Opportunity
        Auto_Submission_to_Underwriting__c:
          type: boolean
          description: Auto submit to underwriting
        StageName:
          type: string
          description: Opportunity stage
        RecordTypeId:
          type: string
          description: |
            Record Type ID for the opportunity
            
            Valid Record Type IDs:
            - Cross_Sell: 0122T000000kwYzQAI
            - New_Direct_Merchant_Opportunity: 01234000000QEUSAA4
            - New_Partner_Merchant: 01234000000M77hAAC
            - New_Partner_Opportunity: 01234000000HqAGAA0
            - Read_Only_New_Partner_Merchant: 0123x000001WMxcAAG
            - Renewal: 0122T000000ca5QQAQ
        Need_Pricing_Exception_Approval__c:
          type: boolean
          description: Whether pricing exception approval is needed
        Account_Type__c:
          type: string
          description: Account type
          enum:
            - New Merchant
            - Conversion Merchant
            - Renewal Merchant
            - Cloned Merchant Deal
        Name:
          type: string
          description: Opportunity name
          maxLength: 255
        BET_Table_ID_API_Field__c:
          type: string
          description: BET Table ID (required)
          maxLength: 255
        Yearly_Net_Revenue__c:
          type: number
          format: double
          description: Forecasted yearly net revenue (required)
          nullable: true
        Yearly_Card_Volume__c:
          type: number
          format: double
          description: Yearly card volume
        High_Monthly_Volume__c:
          type: number
          format: double
          description: High monthly processing volume
        Avg_Ticket__c:
          type: number
          format: double
          description: Average ticket amount
        High_Ticket__c:
          type: number
          format: double
          description: High ticket amount
        Visa_MC_Discover_Volume__c:
          type: number
          format: double
          description: Visa/MC/Discover volume (required)
        American_Express_Volume__c:
          type: number
          format: double
          description: American Express volume
        Seasonal_Months__c:
          type: string
          description: Seasonal months of operation (multi-select picklist - separate values with semicolons)
          example: "Jan;Feb"
        Customer_Type_B2B_Sales__c:
          type: number
          format: double
          description: Customer Type % B2B Sales (must add up to 100% with B2C per validation rules)
          minimum: 0
          maximum: 100
          nullable: true
        Customer_Type_B2C_Sales__c:
          type: number
          format: double
          description: Customer Type % B2C Sales (must add up to 100% with B2B per validation rules)
          minimum: 0
          maximum: 100
        Refund_Policy__c:
          type: string
          description: Refund policy
          enum:
            - Refund in 30 days or Less
            - No Refunds or Exchanges
            - Exchanges Only
            - Not Applicable
            - Credit V/MC/Dis Account
            - Full Refund
            - Refund Credit
            - Refund Merchandise
        Days_to_Ship_Deliver__c:
          type: string
          description: Days to ship/deliver
          enum:
            - Immediate
            - 1 to 7
            - 8 to 14
            - 15 to 30
            - Over 30
        Advanced_Payments__c:
          type: number
          format: double
          description: Percentage of advanced payments
          minimum: 0
          maximum: 100
        Visa_MasterCard__c:
          type: boolean
          description: Accepts Visa/MasterCard
        Discover_MeS_Settlement__c:
          type: boolean
          description: Discover MeS settlement
        Discover_Settlement_Existing_Merchant__c:
          type: boolean
          description: Discover settlement existing merchant
        American_Express_MeS_Settlement__c:
          type: boolean
          description: American Express MeS settlement
        Amex_Settlement_Existing_SE__c:
          type: string
          description: AmEx settlement existing SE number
          maxLength: 255
        Debit_with_Pin__c:
          type: boolean
          description: Debit with PIN
        ACH__c:
          type: string
          description: ACH configuration
        EBT__c:
          type: string
          description: EBT acceptance
        FCS__c:
          type: string
          description: FCS number
          maxLength: 10
        Check_Authorization__c:
          type: string
          description: Check authorization
        Name_of_Provider__c:
          type: string
          description: Name of provider
          maxLength: 60
        Merchant__c:
          type: string
          description: Merchant number
          maxLength: 40
        Check_pct__c:
          type: number
          format: double
          description: Check percentage
          minimum: 0
          maximum: 100
        Card_Network_Volume_Internet_CNP__c:
          type: number
          format: double
          description: Card Network Volume % Internet (CNP) - must add up to 100% with other card network volume fields per validation rules
          minimum: 0
          maximum: 100
        Card_Network_Volume_Manually_K_M__c:
          type: number
          format: double
          description: Card Network Volume % Manually K/M (CP) - must add up to 100% with other card network volume fields per validation rules
          minimum: 0
          maximum: 100
        Card_Network_Volume_MO_TO_CNP__c:
          type: number
          format: double
          description: Card Network Volume % MO/TO (CNP) - must add up to 100% with other card network volume fields per validation rules
          minimum: 0
          maximum: 100
        Card_Network_Volume_Swiped_CP__c:
          type: number
          format: double
          description: Card Network Volume % Swiped (CP) - must add up to 100% with other card network volume fields per validation rules
          minimum: 0
          maximum: 100
        ACH_Debit_Avg_Dollar_Per_Tx__c:
          type: number
          format: double
          description: ACH Debit average dollar per transaction
        ACH_Credit_Avg_Dollar_Per_Tx__c:
          type: number
          format: double
          description: ACH Credit average dollar per transaction
        ACH_Debit_Max_Dollar_Per_Tx__c:
          type: number
          format: double
          description: ACH Debit maximum dollar per transaction
        ACH_Credit_Max_Dollar_Per_Tx__c:
          type: number
          format: double
          description: ACH Credit maximum dollar per transaction
        ACH_Debit_Max_Dollar_Per_Day__c:
          type: number
          format: double
          description: ACH Debit maximum dollar per day
        ACH_Credit_Max_Dollar_Per_Day__c:
          type: number
          format: double
          description: ACH Credit maximum dollar per day
        ACH_Debit_Max_Tx_Per_Day__c:
          type: number
          format: double
          description: ACH Debit maximum transactions per day
        ACH_Credit_Max_Tx_Per_Day__c:
          type: number
          format: double
          description: ACH Credit maximum transactions per day
        ACH_Debit_Max_Dollar_Per_Month__c:
          type: number
          format: double
          description: ACH Debit maximum dollar per month
        ACH_Credit_Max_Dollar_Per_Month__c:
          type: number
          format: double
          description: ACH Credit maximum dollar per month
        ACH_Debit_Max_Tx_Per_Month__c:
          type: number
          format: double
          description: ACH Debit maximum transactions per month
        ACH_Credit_Max_Tx_Per_Month__c:
          type: number
          format: double
          description: ACH Credit maximum transactions per month
        Merchant_Application_Notes__c:
          type: string
          description: Merchant application notes (required)
          maxLength: 255

    Account:
      type: object
      required:
        - attributes
        - Name
        - Legal_Name__c
        - Tax_ID__c
        - State_of_Entity_Formation_Incorporation__c
        - BillingStreet
        - BillingCity
        - BillingStateCode
        - BillingPostalCode
        - BillingCountryCode
        - ShippingStreet
        - ShippingCity
        - Phone
        - App_Email__c
        - Customer_Service_Phone__c
        - Ownership
        - Industry
        - Location_Type__c
        - Years_at_Location__c
        - Date_Established__c
        - Chain_Non_Chain__c
        - Description
        - MCC_API_Field__c
        - Sponsorship__c
      properties:
        attributes:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - Account
        Name:
          type: string
          description: Merchant DBA Name (required). If field exceeds maximum length, value will be truncated.
          maxLength: 255
        Association_ID_API_Field__c:
          type: string
          description: Association ID. Validation error if invalid Association ID entered.
          maxLength: 100
        MCC_API_Field__c:
          type: string
          description: MCC (Merchant Category Code) - required. Validation error if invalid MCC entered.
          maxLength: 100
        Legal_Name__c:
          type: string
          description: Legal name (required). If field exceeds maximum length, value will be truncated.
          maxLength: 100
        Tax_ID__c:
          type: string
          description: Federal Tax ID - must be 9 digits (required). Validation error "Federal Tax ID Enter valid Federal Tax ID" if not 9 digits.
          pattern: '^\d{9}$'
          maxLength: 16
        State_of_Entity_Formation_Incorporation__c:
          type: string
          description: State of formation/incorporation (required)
          maxLength: 2
        BillingStreet:
          type: string
          description: Legal street address (required). If field exceeds maximum length, value will be truncated.
          maxLength: 255
        BillingCity:
          type: string
          description: Legal city (required). If field exceeds maximum length, value will be truncated.
          maxLength: 40
        BillingStateCode:
          type: string
          description: Legal state/province code (required). See PDF pages 36-38 for full list of valid state codes.
          maxLength: 80
        BillingPostalCode:
          type: string
          description: Legal zip code - must be 5 digits (required). Validation error "Legal Address Zipcode Enter Valid Legal Address Zipcode" if not 5 digits.
          pattern: '^\d{5}$'
          maxLength: 20
        BillingCountryCode:
          type: string
          description: Legal country code (required). See PDF pages 36-38 for full list of valid country codes.
          maxLength: 80
        ShippingStreet:
          type: string
          description: DBA street address (required). If field exceeds maximum length, value will be truncated.
          maxLength: 255
        ShippingCity:
          type: string
          description: DBA city. If field exceeds maximum length, value will be truncated.
          maxLength: 40
        ShippingStateCode:
          type: string
          description: DBA state/province code. See PDF pages 36-38 for full list of valid state codes.
          maxLength: 80
        ShippingPostalCode:
          type: string
          description: DBA zip code - must be 5 digits if provided. Validation error "DBA Address Zipcode Enter valid DBA Address Zipcode" if not 5 digits.
          pattern: '^\d{5}$'
          maxLength: 20
        ShippingCountryCode:
          type: string
          description: DBA country code. See PDF pages 36-38 for full list of valid country codes.
          maxLength: 80
        Physical_Address_Street__c:
          type: string
          description: Physical address street. If field exceeds maximum length, value will be truncated.
          maxLength: 255
        Physical_Address_City__c:
          type: string
          description: Physical address city. If field exceeds maximum length, value will be truncated.
          maxLength: 80
        Physical_Address_State__c:
          type: string
          description: Physical address state. See PDF pages 36-38 for valid state codes.
          maxLength: 80
        Physical_Address_PostalCode__c:
          type: string
          description: Physical address postal code - must be 5 digits if provided. Validation error "Mailing Address Zipcode Enter valid Mailing Address Zipcode" if not 5 digits.
          pattern: '^\d{5}$'
          maxLength: 80
        Phone:
          type: string
          description: Phone number - must be 10 digits or (999) 999-9999 format (required). Validation error "Phone/Fax number must be a 10-digit number or in (999) 999-9999 format" if invalid.
          pattern: '^(\d{10}|\(\d{3}\)\s\d{3}-\d{4})$'
        Fax:
          type: string
          description: Fax number - must be 10 digits or (999) 999-9999 format if provided. Validation error "Phone/Fax number must be a 10-digit number or in (999) 999-9999 format" if invalid.
          pattern: '^(\d{10}|\(\d{3}\)\s\d{3}-\d{4})$'
        App_Email__c:
          type: string
          format: email
          description: Email address (required). Validation error "Enter valid Email Address" if invalid format.
          maxLength: 100
        Website:
          type: string
          format: uri
          description: Website address
          maxLength: 255
        Customer_Service_Phone__c:
          type: string
          description: Customer service phone - must be 10 digits or (999) 999-9999 format (required)
          pattern: '^(\d{10}|\(\d{3}\)\s\d{3}-\d{4})$'
        Ownership:
          type: string
          description: |
            Legal entity type (required). Validation error "Sponsorship is required" if missing.
            
            See PDF pages 27-28 for required contact fields based on this ownership type.
          enum:
            - Sole Proprietorship
            - Publicly Traded Limited Liability Company
            - Privately Held Limited Liability Company
            - Publicly Traded Corporation
            - Privately Held Corporation
            - Government
            - Tax Exempt
            - Publicly Traded Partnership
            - Privately Held Partnership
            - Financial Institution
        Industry:
          type: string
          description: Industry (required)
          enum:
            - Retail
            - Restaurant
            - Lodging
            - Supermarket
            - Ecommerce
            - Direct Marketing Services
            - Cash Advance
            - Other
        Industry_Other__c:
          type: string
          description: Other industry description (required if Industry is "Other")
          maxLength: 100
        Location_Type__c:
          type: string
          description: Business location type (required)
          enum:
            - Ecommerce
            - Business Office
            - Private Residence
            - Retail Storefront
            - Bank
            - Other
        Location_Other__c:
          type: string
          description: Other location description (required if Location_Type__c is "Other")
          maxLength: 100
        Years_at_Location__c:
          type: string
          description: Years at location (required)
