          type: string
          description: Product name (required when submitting equipment information)
          maxLength: 200
        Equipment_Unique_Field__c:
          type: string
          description: Equipment unique field (for identifying multiple equipment items in create/update requests)
          maxLength: 20

    AttachmentRequest:
      type: object
      required:
        - Opportunity
        - attachments
      properties:
        Opportunity:
          type: object
          required:
            - Id
          properties:
            Id:
              type: string
              description: Opportunity ID (required for submitting attachments)
        attachments:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - Body
              - ContentType
              - Name
            properties:
              Body:
                type: string
                format: byte
                description: File content encoded in Base64 (max 100 MB per file, 2 GB total)
              ContentType:
                type: string
                description: MIME type of the file
                example: text/plain
              Name:
                type: string
                description: Filename
                example: hello.txt

    ApplicationResponse:
      type: object
      properties:
        Success:
          type: boolean
          description: Indicates if the data element was created/updated successfully (true/false)
        SourceId:
          type: string
          nullable: true
          description: |
            Unique identifier for objects with multiple instances:
            - For Contact: returns value of Beneficial_Owner_Unique_Field__c
            - For Business Checking Account: returns value of Checking_Account_Unique_Field__c
            - For Quote Line Item (Equipment): returns value of Equipment_Unique_Field__c
            - Returns null for single-instance objects (Account, Opportunity, Quote)
        SFId:
          type: string
          description: Unique Salesforce ID for the created/updated record
        ObjectType:
          type: string
          description: Type of data object being sent and received through the API
          enum:
            - Account
            - Opportunity
            - Contact
            - Business Checking Account
            - Quote
            - QuoteLineItem
        Message:
          type: string
          description: A string of text that indicates if a specific data object was created/updated successfully
          example: "Merchant Information Created Successfully."

    ValidationError:
      type: object
      description: |
        Validation error response. If any validation errors occur, the entire request is rejected and no information is saved.
        
        See PDF pages 69-72 for complete list of validation rules.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: Error message describing the validation failure
                example: "Phone/Fax number must be a 10-digit number or in (999) 999-9999 format."
              errorCode:
                type: string
                description: Error code
                example: FIELD_CUSTOM_VALIDATION_EXCEPTION
              fields:
                type: array
                items:
                  type: string
                description: Field names that failed validation

    Error:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string

