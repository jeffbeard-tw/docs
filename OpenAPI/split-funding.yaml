openapi: 3.0.3
info:
  title: MerchantE Split Funding API
  description: |
    The Split Funding API enables partners' businesses to split their daily settlement amount into two different bank accounts.

    This API allows creation or modification of MerchantFundingAmount for approved, non-PIN-debit, cardholder-debit or credit Transactions.

    **Documentation Resources:**
    - MerchantE Technical Documentation: https://anypoint.mulesoft.com/exchange/portals/merchante-solutions-3/
    - PCI Security Standards: https://www.pcisecuritystandards.org/
    - NAICS Lookup: https://www.census.gov/econ/isp/

    **Copyright Notice:**
    ©2024 Merchant eSolutions, Inc. All rights reserved.

    Merchant e-Solutions, Inc. is a registered Agent of KeyBank, Cleveland, OH, and a registered ISO/MSP of Synovus Bank, Columbus, GA and FFB, Fresno, CA.

    **Trademarks:**
    - Mastercard® is a federally registered trademark of Mastercard International, Inc.
    - Visa® is a federally registered trademark of Visa, U.S.A., Inc.
    - Discover® Card is a federally registered trademark of Discover Financial Services Inc.
    - American Express® is a federally registered trademark of American Express Company.
    - ZIP code® and ZIP + 4® are federally registered trademarks of the United States Postal Service.
  version: '1.0'
  contact:
    name: MerchantE Support
    url: https://www.merchante.com
  x-address:
    street: 1150 Sanctuary Parkway, Suite 300
    city: Alpharetta
    state: GA
    zip: '30009'

servers:
  - url: https://api.merchante.com/v1
    description: Production server
  - url: https://sandbox.merchante.com/v1
    description: Sandbox server

security:
  - BasicAuth: []

paths:
  /funding-amounts:
    post:
      summary: Create or modify funding amounts
      description: |
        Used to create or modify MerchantFundingAmount for approved, non-PIN-debit, cardholder-debit or credit Transactions.

        **Request Constraints:**
        - Can contain 1 to 10,000 Transaction(s)
        - Must not contain any debit Transactions that have been settled
        - Can contain credit transactions that have been settled
        - Must not contain duplicate Transactions
        - Debit transactions can be specified by either retrievalReferenceNumber or transactionId, but not both
        - Credit transactions can only be specified by transactionId
      operationId: createFundingAmounts
      tags:
        - Funding Amounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundingAmountsRequest'
            examples:
              twoTransactions:
                summary: Two transactions with split funding
                value:
                  transactions:
                    - id: "ABC12345678901234567890123456789"
                      retrievalReferenceNumber: null
                      merchantFundingAmounts:
                        - merchantId: "9999999999"
                          amount: "10000"
                        - merchantId: "8888888888"
                          amount: "500"
                    - id: "XYZ12345678901234567890123456789"
                      retrievalReferenceNumber: null
                      merchantFundingAmounts:
                        - merchantId: "9999999999"
                          amount: "10000"
                        - merchantId: "8888888888"
                          amount: "500"
      responses:
        '200':
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingAmountsResponse'
              examples:
                successWithError:
                  summary: Partial success with one transaction error
                  value:
                    transactionCount: "2"
                    merchantFundingAmountCount: "4"
                    amountsSum: "21000"
                    successfulTransactionCount: "1"
                    errorCode: ""
                    errorMessage: ""
                    transactionLevelErrors:
                      - transactionId: "XYZ12345678901234567890123456789"
                        retrievalReferenceNumber: ""
                        errorCode: "100"
                        errorMessage: "unknown transactionId"
                allSuccess:
                  summary: All transactions processed successfully
                  value:
                    transactionCount: "2"
                    merchantFundingAmountCount: "4"
                    amountsSum: "21000"
                    successfulTransactionCount: "2"
                    errorCode: ""
                    errorMessage: ""
                    transactionLevelErrors: []
        '400':
          description: Bad Request - Request body cannot be processed due to issues such as unsupported content type, malformed body, values exceeding the max field size, values of incorrect data type, too many or not enough records. No response body is provided for this error.
        '401':
          description: Unauthorized - The provided profileId is unknown or the provided profileKey is incorrect for the provided profileId. No response body is provided for this error.
        '403':
          description: Forbidden - The provided profileId and profileKey is known and correct, but the profileId is associated with a profile that is no longer active (i.e. it is suspended or closed). No response body is provided for this error.
        '500':
          description: Internal Server Error - The server encountered an unexpected error and could not process the request. No response body is provided for this error.

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        The Authorization field contains the credentials of the client making the request and uses the 'Basic' HTTP Authentication Scheme.

        The value in the Authorization field has the following format:
        Basic [encoded credentials]

        Where [encoded credentials] is constructed as follows:
        1. The profileId and profileKey of the Terminal making the request are combined with a colon separating the two values
        2. The resulting string is encoded using base-64
        3. The resulting encoded string is appended to the literal 'Basic '

        Example: Basic <base64-encoded-credentials>

  schemas:
    FundingAmountsRequest:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          description: Array of Transaction objects
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Transaction'

    Transaction:
      type: object
      description: |
        Used to specify an approved, non-PIN-debit, cardholder-debit or cardholder-credit Transaction that has corresponding MerchantFundingAmount(s).

        **Constraints:**
        - A Funding Amounts Request can contain 1 to 10,000 Transaction(s)
        - A Funding Amounts Request must not contain any debit Transactions that have been settled
        - A Funding Amounts Request that has credit transactions can contain transactions that have been settled
        - A Funding Amounts Request must not contain the same Transaction more than once (i.e. no duplicate Transactions in a Funding Amounts Request)
        - The Transactions in a Funding Amounts Request for a debit transaction can be specified by either a retrievalReferenceNumber or a transactionId, but not both
        - The Transactions in a Funding Amounts Request for a credit transaction can only be specified by transactionId
      required:
        - merchantFundingAmounts
      properties:
        id:
          type: string
          nullable: true
          description: A value generated by ME for each authorization request.
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+$'
          example: "ABC12345678901234567890123456789"
        retrievalReferenceNumber:
          type: string
          nullable: true
          description: A value generated by ME for each new authorization request.
          maxLength: 12
          pattern: '^[0-9]+$'
          example: "123456789012"
        merchantFundingAmounts:
          type: array
          description: Array of MerchantFundingAmount objects
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/MerchantFundingAmount'

    MerchantFundingAmount:
      type: object
      description: |
        Used to specify a Merchant and the amount the Merchant should be funded/debited for a given Transaction.

        **Constraints:**
        - A Transaction can contain 1 to 10 MerchantFundingAmount(s)
      required:
        - merchantId
        - amount
      properties:
        merchantId:
          type: string
          description: ME's unique identifier of the Merchant that will be funded the specified amount for the corresponding Transaction. For a given Transaction, merchantId must be unique.
          maxLength: 16
          pattern: '^[0-9]+$'
          example: "9999999999"
        amount:
          type: string
          description: |
            The unsigned amount the corresponding Merchant should be funded/debited for the corresponding Transaction. The currency of the amount is implied and is the same as the currency of the corresponding Transaction. The location of the decimal point is implied based on the minor units of the currency of the corresponding Transaction. For example, if the currency of the Transaction is USD, then an amount of "100" is interpreted as 1.00 USD.

            The sum of all amount(s) of a given MerchantFundingAmount must equal the current authorized amount of the corresponding Transaction if the Transaction has not been captured for settlement, or the settlement amount if the Transaction has been captured but not yet settled.
          maxLength: 9
          pattern: '^[0-9]+$'
          example: "10000"

    FundingAmountsResponse:
      type: object
      description: |
        The response body contains the parameters of the response in JSON format. The response body consists of fields that summarize the request, request-level error fields, and zero or many TransactionLevelError objects.

        When the response contains HTTP Status Code other than 200, a body will NOT be provided in the response.
      required:
        - transactionCount
        - merchantFundingAmountCount
        - amountsSum
        - successfulTransactionCount
      properties:
        transactionCount:
          type: string
          description: The number of Transactions specified in the corresponding request.
          maxLength: 6
          pattern: '^[0-9]+$'
          example: "2"
        merchantFundingAmountCount:
          type: string
          description: The number of MerchantFundingAmount(s) specified in the corresponding request.
          maxLength: 7
          pattern: '^[0-9]+$'
          example: "4"
        amountsSum:
          type: string
          description: |
            The hash sum of amount(s) for all MerchantFundingAmount(s) specified in the corresponding request. Since the request could contain Transactions in more than one currency, the value of amountsSum should not be interpreted as a Monetary sum of amounts with a single currency.
          maxLength: 15
          pattern: '^[0-9]+$'
          example: "21000"
        successfulTransactionCount:
          type: string
          description: The number of Transactions specified in the corresponding request that did not contain errors and that were processed successfully.
          maxLength: 6
          pattern: '^[0-9]+$'
          example: "1"
        errorCode:
          type: string
          description: |
            Specifies a client error that occurred at the request level.

            When an error occurs at the request level, the value of successfulTransactionCount will be zero. When no error occurs at the request level, no value for errorCode and errorMessage will be provided in the response.

            The following errorCode values will be returned under the specified request-level error conditions:
            - "1": will be returned if both retrievalReferenceNumber and transactionId were provided for a Transaction in the Funding Amounts Request
            - "2": will be returned if neither retrievalReferenceNumber or transactionId were provided for a Transaction in the Funding Amounts Request
            - "3": will be returned if duplicate Transactions are specified in the request
          maxLength: 3
          pattern: '^[0-9]*$'
          enum:
            - ""
            - "1"
            - "2"
            - "3"
          example: ""
        errorMessage:
          type: string
          description: |
            A human-readable description of the corresponding errorCode. For a given error code, there is no guarantee of what the corresponding errorMessage will be. Thus, no programming decisions should be made based on this value.
          maxLength: 200
          example: ""
        transactionLevelErrors:
          type: array
          description: Array of transaction-level errors. Contains zero or many TransactionLevelError objects.
          items:
            $ref: '#/components/schemas/TransactionLevelError'

    TransactionLevelError:
      type: object
      description: |
        Specifies an error that occurred at the Transaction level. An error that occurred at Transaction level results in the failure to process all MerchantFundingAmount(s) for the Transaction that contained the error.
      required:
        - errorCode
        - errorMessage
      properties:
        transactionId:
          type: string
          description: If a transactionId was provided in the request to specify the Transaction, this field will contain the transactionId of the Transaction that was provided in the request that contains the error; otherwise, no value will be provided in this field.
          maxLength: 32
          pattern: '^[a-zA-Z0-9]*$'
          example: "XYZ12345678901234567890123456789"
        retrievalReferenceNumber:
          type: string
          description: If a retrievalReferenceNumber was provided in the request to specify the Transaction, this field will contain the retrievalReferenceNumber of the Transaction that was provided in the request that contains the error; otherwise, no value will be provided in this field.
          maxLength: 12
          pattern: '^[0-9]*$'
          example: ""
        errorCode:
          type: string
          description: |
            Specifies a client error that occurred at the Transaction level.

            For each Transaction level error that occurs, the value of successfulTransactionCount will be decremented by one from transactionCount in the corresponding PostFundingAmountsResponse.

            The following errorCode values will be returned under the specified Transaction-level error conditions:

            - "100": If the provided transactionId or retrievalReferenceNumber is unknown to ME or if the corresponding Transaction is not an approved, non-PIN-debit, cardholder-debit or cardholder-credit Transaction that was initiated by the Profile corresponding to the provided profileId
            - "101": If the provided transactionId corresponds to a debit Transaction that has already been settled
            - "102": If a provided merchantId is unknown to ME or corresponds to a Merchant that is no longer active
            - "103": If duplicate merchantId(s) are found in a given MerchantFundingAmount
            - "104": If an amount is not greater than zero
            - "105": If the sum of all amount(s) of a given MerchantFundingAmount does not equal the current authorized amount (when the corresponding Transaction has not yet been captured for settlement) or the settlement amount (when the corresponding Transaction has been captured but not settled)

            errorCode conditions will be assessed in the order listed above and the errorCode returned will be that of the first condition encountered.
          maxLength: 3
          pattern: '^[0-9]+$'
          enum:
            - "100"
            - "101"
            - "102"
            - "103"
            - "104"
            - "105"
          example: "100"
        errorMessage:
          type: string
          description: |
            A human-readable description of the corresponding errorCode. For a given error code, there is no guarantee of what the corresponding errorMessage will be. Thus, no programming decisions should be made based on this value.
          maxLength: 200
          example: "unknown transactionId"

tags:
  - name: Funding Amounts
    description: Operations for creating and modifying merchant funding amounts

