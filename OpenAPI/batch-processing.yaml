paths:
  /bpUpload:
    post:
      summary: Upload batch request file
      description: |
        Used to upload a batch of transactions to ME. All batch API requests are handled by an HTTPS POST to this endpoint. File data should be passed to the server using Content-Type: multipart/form-data. After uploading a file, a confirmation message is sent containing the response identification number.

        The transactional data that is being uploaded should be a text file (.TXT) that has transactions formatted as outlined in the ME Payment Gateway Specification.
      operationId: uploadBatchFile
      tags:
        - Batch Processing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            examples:
              batchUpload:
                summary: Batch file upload request
                value:
                  userId: "merchant123"
                  userPass: "password123"
                  profileId: "12345678901234567890"
                  testFlag: "N"
                  reqFile: "transaction_type=P&card_number=4012888812348882&card_exp_date=1216&transaction_amount=1.00&cvv2=123&cardholder_street_address=123+N.+Main&cardholder_zip=55555&invoice_number=123456"
      responses:
        '200':
          description: File successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadConfirmation'
              examples:
                successfulUpload:
                  summary: Successful upload confirmation
                  value:
                    reqFile: "batch_20240126.txt"
                    userId: "merchant123"
                    userPass: "password123"
                    respFileId: "123456789012345"
                    profileId: "12345678901234567890"
                    testFlag: "N"
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParameter:
                  summary: Invalid parameter error
                  value:
                    rspCode: "003"
                    rspMessage: "Invalid Parameter"
        '401':
          description: Unauthorized - Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authError:
                  summary: Authentication error
                  value:
                    rspCode: "002"
                    rspMessage: "Authentication Error"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                systemError:
                  summary: System error
                  value:
                    rspCode: "001"
                    rspMessage: "System Error"

  /bpDownload:
    post:
      summary: Download batch response file
      description: |
        Used to download a batch response file. All batch API requests are handled by an HTTPS POST to this endpoint. Response files are used to determine the status of each of the transactions that was submitted in a batch.

        The response file contains transaction data formatted according to the ME Payment Gateway Specification, with each transaction response on a separate line.
      operationId: downloadBatchFile
      tags:
        - Batch Processing
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
            examples:
              downloadRequest:
                summary: Download response file request
                value:
                  userId: "merchant123"
                  userPass: "password123"
                  respFileId: "123456789012345"
      responses:
        '200':
          description: Response file successfully retrieved
          content:
            text/plain:
              schema:
                type: string
                description: Text file containing transaction responses, one per line, formatted according to ME Payment Gateway Specification
                example: |
                  transaction_id=ce79a48df5733202ad5f533286f6d943&error_code=000&auth_response_text=Match&avs_result=Y&cvv2_result=M&auth_code=T7997H
                  transaction_id=b2d7bfc52e5f3be0ad2a1845dd9f6235&error_code=000&auth_response_text=Match&avs_result=Y&cvv2_result=M&auth_code=T8004H
                  transaction_id=4eb67cb684e03f739a51b4eba71daba8&error_code=000&auth_response_text=Match&avs_result=Y&cvv2_result=M&auth_code=T8008H
                  transaction_id=aaccde91d942723b119bed4d25673a7&error_code=000&auth_response_text=Match&avs_result=Y&cvv2_result=M&auth_code=T8012H
        '400':
          description: Bad Request - Invalid response file ID or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadConfirmation'
              examples:
                invalidFileId:
                  summary: Invalid response file ID
                  value:
                    userId: "merchant123"
                    respFileId: "123456789012345"
                    rspCode: "301"
                    rspMessage: "Invalid response file ID"
        '401':
          description: Unauthorized - Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadConfirmation'
              examples:
                authError:
                  summary: Authentication error
                  value:
                    userId: "merchant123"
                    respFileId: "123456789012345"
                    rspCode: "002"
                    rspMessage: "Authentication Error"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadConfirmation'
              examples:
                systemError:
                  summary: System error
                  value:
                    userId: "merchant123"
                    respFileId: "123456789012345"
                    rspCode: "001"
                    rspMessage: "System Error"

components:
  schemas:
    UploadRequest:
      type: object
      description: Request parameters for uploading a batch file
      required:
        - reqFile
        - userId
        - userPass
        - profileId
      properties:
        reqFile:
          type: string
          format: binary
          description: Contains the transaction file that is being transmitted to ME. Should be a text file (.TXT) with transactions formatted as outlined in the ME Payment Gateway Specification.
        userId:
          type: string
          description: ME login ID
          maxLength: 32
          example: "merchant123"
        userPass:
          type: string
          description: ME login password
          maxLength: 32
          format: password
          example: "password123"
        profileId:
          type: string
          description: The ME gateway profile ID the record is associated with
          maxLength: 20
          pattern: '^[0-9]+$'
          example: "12345678901234567890"
        testFlag:
          type: string
          description: Indicates if the file is a test file or not. The default value is N, but Y can be set in order to send a test file that will route to the ME simulator
          maxLength: 1
          pattern: '^[YN]$'
          default: "N"
          enum:
            - "Y"
            - "N"
          example: "N"

    UploadConfirmation:
      type: object
      description: Upload request confirmation parameters
      required:
        - reqFile
        - userId
        - userPass
        - respFileId
        - profileId
      properties:
        reqFile:
          type: string
          description: Contains the transaction file that is being transmitted to ME
          example: "batch_20240126.txt"
        userId:
          type: string
          description: ME login ID
          maxLength: 32
          example: "merchant123"
        userPass:
          type: string
          description: ME login password
          maxLength: 32
          example: "password123"
        respFileId:
          type: string
          description: The File ID from the processed batch
          maxLength: 15
          pattern: '^[0-9]+$'
          example: "123456789012345"
        profileId:
          type: string
          description: The ME gateway profile ID the record is associated with
          maxLength: 20
          pattern: '^[0-9]+$'
          example: "12345678901234567890"
        testFlag:
          type: string
          description: Indicates if the file is a test file or not. The default value is N, but Y can be set in order to send a test file that will route to the ME simulator
          maxLength: 1
          pattern: '^[YN]$'
          default: "N"
          enum:
            - "Y"
            - "N"
          example: "N"

    DownloadRequest:
      type: object
      description: Request parameters for downloading a batch response file
      required:
        - userId
        - userPass
        - respFileId
      properties:
        userId:
          type: string
          description: ME login ID
          maxLength: 32
          example: "merchant123"
        userPass:
          type: string
          description: ME login password
          maxLength: 32
          format: password
          example: "password123"
        respFileId:
          type: string
          description: The File ID from the processed batch
          maxLength: 15
          pattern: '^[0-9]+$'
          example: "123456789012345"

    DownloadConfirmation:
      type: object
      description: |
        Confirmation file parameters. This request confirmation is only received if an error has occurred.
      required:
        - userId
        - respFileId
        - rspCode
        - rspMessage
      properties:
        userId:
          type: string
          description: ME login ID
          maxLength: 32
          example: "merchant123"
        respFileId:
          type: string
          description: The File ID from the processed batch
          maxLength: 15
          pattern: '^[0-9]+$'
          example: "123456789012345"
        rspCode:
          type: string
          description: Three-digit response/error code
          maxLength: 3
          pattern: '^[0-9]+$'
          example: "301"
        rspMessage:
          type: string
          description: Text that accompanies the three-digit response/error code
          maxLength: 45
          example: "Invalid response file ID"

    ErrorResponse:
      type: object
      description: Standard error response
      required:
        - rspCode
        - rspMessage
      properties:
        rspCode:
          type: string
          description: |
            Three-digit response/error code

            **Error Codes:**
            - "000": OK - Batch was successfully received
            - "001": System Error - Contact ME for research and resolution
            - "002": Authentication Error - Invalid access right or invalid user ID and/or user password
            - "003": Invalid Parameter - Check format to correct the invalid parameter
            - "004": Missing parameter - Check format for missing parameter
            - "300": Invalid Profile ID - Verify Profile ID is correct and resend batch
            - "301": Invalid response file ID - Verify that user ID, user password, and file ID are valid and retry
            - "302": Invalid test flag - Valid values are Y and N, default is N, field not required. Please check request file message
            - "303": Batch processing not allowed - Contact ME, batch processing must be enabled for the profile ID used
          maxLength: 3
          pattern: '^[0-9]+$'
          enum:
            - "000"
            - "001"
            - "002"
            - "003"
            - "004"
            - "300"
            - "301"
            - "302"
            - "303"
          example: "003"
        rspMessage:
          type: string
          description: Text that accompanies the three-digit response/error code
          maxLength: 45
          example: "Invalid Parameter"

tags:
  - name: Batch Processing
    description: Operations for batch processing of credit card transactions

